    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
        background: #242c33;
        color: #ddd;
      }

      h1,
      h2 {
        margin-top: 0;
        color: #fff;
      }

      .folder-list {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
      }

      .folder {
        background: #2c3742;
        border: 1px solid #455666;
        padding: 25px 20px;
        width: 180px;
        text-align: center;
        cursor: pointer;
        border-radius: 4px;
      }

      .folder:hover {
        background: #35414f;
      }

      .images {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 15px;
      }

      .image-item {
        background: #2c3742;
        border: 1px solid #455666;
        padding: 10px;
        text-align: center;
        border-radius: 4px;
      }

      .image-item img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto 10px;
      }

      button {
        margin: 5px;
        padding: 8px 14px;
        background: #455666;
        color: #ddd;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background: #5a7290;
      }

      .nav {
        margin-bottom: 20px;
      }
    </style>
  </head>

      <div class="folder-list" id="folders"></div>

      function showHome() {
        document.getElementById("home").style.display = "block";
        document.getElementById("folder-view").style.display = "none";
      }

      function showFolder(folderKey) {
        currentFolder = folderKey;
        const folder = foldersData[folderKey];
        document.getElementById("home").style.display = "none";
        document.getElementById("folder-view").style.display = "block";
        document.getElementById("current-folder").textContent = folder.name;
        const container = document.getElementById("image-list");
        container.innerHTML = "";
        folder.images.forEach(img => {
          const div = document.createElement("div");
          div.className = "image-item";
          div.innerHTML = `
                    
					<img src="${img.url}" alt="${img.name}">
						<div>${img.name}</div>
						<button onclick="downloadSingle('${img.url}', '${img.name}')">ダウンロード</button>
                `;
          container.appendChild(div);
        });
      }

      function goBack() {
        showHome();
      }

      function downloadSingle(url, filename) {
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function downloadZip() {
        const folder = foldersData[currentFolder];
        const a = document.createElement("a");
        a.href = folder.zip;
        a.download = "";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      function init() {
        const container = document.getElementById("folders");
        container.innerHTML = "";
        Object.keys(foldersData).forEach(key => {
          const f = foldersData[key];
          const div = document.createElement("div");
          div.className = "folder";
          div.innerHTML = `
						<strong>${f.name}</strong>
						<br>
							<small>${f.path}</small>`;
          div.onclick = () => showFolder(key);
          container.appendChild(div);
        });
      }
      window.onload = init;
    </script>
