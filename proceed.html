<!DOCTYPE html>
<html>
<head>
<title>前進</title>
<style>
body {
margin: 0;
padding: 0;
background: rgb(11, 0, 59);
font-family: sans-serif;
text-align: center;
}
button {
font-size: 260px;
background-color: black;
color: rgb(255, 255, 255);
border-color: white;
margin-top: 60px;
}
p {
font-size: 125px;
margin-top: 40px;
}
#overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
display: none;
z-index: 9999;
}
</style>
</head>
<body>
<button onclick="go()">前進</button>
<p id="msg"></p>
<div id="overlay"></div>

<script>
var count = 0;
function go() {
count = count + 1;
if(count == 66) {
var overlay = document.getElementById("overlay");
overlay.style.background = "red";
overlay.style.display = "block";
setTimeout(function() {
overlay.style.background = "black";
}, 400);
setTimeout(function() {
window.close();
}, 1000);
} else {
document.getElementById("msg").innerHTML = count;
}
}
</script>
</body>
</html>
